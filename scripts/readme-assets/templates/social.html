<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .card { width: 1280px; height: 640px; border-radius: 0; border: none; padding: 64px 80px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { width: 360px; margin-left: -18px; }
  .halo { left: 30px; top: 20px; width: 360px; height: 260px; }
  h1 { font-size: 86px; }
  .sub { font-size: 25px; max-width: 980px; margin-top: 22px; }
  .chips { margin-top: 30px; }
  .chip { font-size: 18px; padding: 9px 16px; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
</style></head><body>
<div class="card">
  <div class="halo"></div>
  <div class="top"><img class="logo" src="maat-logo-alpha.png" alt=""><span class="url">github.com/<b>getmaat/maat</b></span></div>
  <div>
    <h1>Docs your agents <span class="grad">can trust.</span></h1>
    <p class="sub">Docs, code and agent instructions stay in sync. <b>API contracts are checked across repos.</b> CI fails the moment they drift.</p>
    <div class="chips">
      <span class="chip t"><i></i>AGENTS.md → 6 agents</span>
      <span class="chip g"><i></i>git-aware staleness</span>
      <span class="chip p"><i></i>cross-repo contracts</span>
      <span class="chip t"><i></i>offline CI gate</span>
    </div>
  </div>
</div></body></html>
